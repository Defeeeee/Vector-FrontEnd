<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vector">
  <!--
    La marca de Vector.

    Es la flecha de rumbo: el símbolo con el que un avión se dibuja a sí mismo en
    cualquier carta móvil. Se eligió por tres razones, y ninguna es estética.

    1. **Se lee a 48 píxeles.** Un ícono de app se ve casi siempre del tamaño de una
       uña, y ahí sobreviven las siluetas macizas y mueren los detalles. Ésta es una
       sola forma cerrada, sin trazos finos ni texto.
    2. **Dice de qué es la app sin escribirlo.** Una flecha de rumbo con la muesca
       atrás no se confunde con un cursor ni con un "play": es navegación.
    3. **Es la V de Vector** dada vuelta, que era el otro camino obvio. Sale gratis.

    Un solo color plano sobre el azul aviación que ya usa la app
    (la variable `color-aviation-blue` de `globals.css:33`). Sin degradados: la mitad de los
    lugares donde este archivo termina —la pestaña, la pantalla de inicio de
    Android, el selector de apps— lo reescalan con algoritmos distintos, y un
    degradado a 32 píxeles se convierte en barro.
  -->
  <rect width="512" height="512" rx="114" fill="#2563eb"/>
  <path d="M256 104 L372 396 L256 340 L140 396 Z" fill="#ffffff"/>
</svg>
