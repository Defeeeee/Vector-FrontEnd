name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una sola corrida por rama: si empujás dos veces seguidas, la vieja se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Levanta el build y comprueba que las rutas respondan. `tsc` no ve los
      # errores de runtime: la página Registrar estuvo rota en producción con
      # los tipos en verde.
      #
      # Con la cuenta de prueba configurada, además entra al dashboard y comprueba
      # que cada pantalla renderice. Si los secrets no están —un PR desde un fork
      # no los recibe— el script omite esa tanda y sigue pasando, en vez de dar
      # rojo por una credencial que ese PR no puede tener.
      - name: Smoke
        run: npm run smoke
        env:
          # El runner no tiene backend: el default del código es
          # `http://127.0.0.1:7477/api`, que acá da ECONNREFUSED y tira abajo toda
          # ruta con SSR. Ese default es el correcto en el VPS —donde el backend
          # vive al lado— así que el caso especial es CI y se arregla acá.
          #
          # **Sin `/api` al final**, al revés que el default local: por el dominio
          # público ese prefijo lo pone nginx. Poner los dos da 404 en todo; no
          # poner ninguno también. Esa asimetría ya causó un corte en producción.
          #
          # Alcanza con esta variable en este paso y no hace falta tocar `Build`:
          # en el bundle del servidor la expresión queda como lectura de runtime
          # (`process.env.API_URL||"http://127.0.0.1:7477/api"` literal en los
          # chunks), así que se resuelve cuando el smoke levanta la app.
          API_URL: https://api.flightlog.fdiaznem.com.ar
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks necesita el historial para revisar los commits del PR.
          fetch-depth: 0

      # Este repo tuvo un secreto compartido hardcodeado en el código durante
      # meses, en un repositorio público. Esto lo habría marcado en el PR que
      # lo introdujo.
      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
