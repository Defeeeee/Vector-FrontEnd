name: CI

on:
  pull_request:
  push:
    branches: [main]

# Una sola corrida por rama: si empujás dos veces seguidas, la vieja se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Levanta el build y comprueba que las rutas respondan. `tsc` no ve los
      # errores de runtime: la página Registrar estuvo rota en producción con
      # los tipos en verde.
      - name: Smoke
        run: npm run smoke

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks necesita el historial para revisar los commits del PR.
          fetch-depth: 0

      # Este repo tuvo un secreto compartido hardcodeado en el código durante
      # meses, en un repositorio público. Esto lo habría marcado en el PR que
      # lo introdujo.
      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
